# The whole of k8s-seed: one Helm release.
#
# This repository seeds only what cannot be reconciled by Argo CD, because it
# must exist before Argo CD does. Everything else a cluster needs — ingress,
# certificates, DNS, Argo CD's own upgrades — is delivered by the gitops
# repository through the root Application in bootstrap/root-app.yaml.
# See docs/gitops-repo.md for the split rule.

# Helmfile requires `environments` to live in its own YAML part, ahead of the
# part that consumes it.
environments:
  default:
    values:
      # requiredEnv, not `env | default`: a production cluster silently seeded
      # at argo.k8s.local pointing at no gitops repository is worse than a
      # failed render. Missing values fail here, before the cluster is touched.
      - clusterName: {{ requiredEnv "TARGET_CLUSTER_NAME" | quote }}
        argoHost: {{ requiredEnv "ARGO_HOST" | quote }}
        # Nothing in the chart reads this. It is declared here so that the check
        # lives at render time for every caller, not only for `just bootstrap`:
        # the gitops credential Secret and the root Application are applied
        # outside the Helm release (see bootstrap/repo-secret.yaml), so without
        # this line a bare `helmfile apply` would seed Argo CD against no
        # gitops repository at all and only fail two steps later.
        gitopsRepoUrl: {{ requiredEnv "GITOPS_REPO_URL" | quote }}
        oidc:
          clientId: {{ requiredEnv "OIDC_CLIENT_ID" | quote }}
          clientSecret: {{ requiredEnv "OIDC_CLIENT_SECRET" | quote }}
          # Unset is a correct default: it selects the Dex bundled in the chart.
          issuerUrl: {{ env "OIDC_ISSUER_URL" | quote }}
          # Optional. Restricts GitHub sign-in to members of this organisation.
          # Empty is a usable default but a wide one — see the comment on the
          # connector in bootstrap/argocd-values.yaml.gotmpl.
          githubOrg: {{ env "GITHUB_ORG" | quote }}

---
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  # Release name `argocd` (not `argo-cd`) keeps the canonical resource names
  # every Argo CD document and command assumes: argocd-server, argocd-repo-server.
  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    # Pinned, never a range: the gitops repository must install this exact
    # version when it adopts the release. See docs/gitops-repo.md.
    #
    # Chosen, not stale. Index checked 2026-08-06: 10.3.0 (2026-08-05) and
    # 10.2.3 (2026-08-04) both ship Argo CD v3.5.0, two days old at the time.
    # 10.2.2 is v3.4.6, the soaked v3.4 line. Since every cluster is seeded with
    # this version and gitops has to match it exactly, a two-day-old minor is
    # the wrong thing to standardise on.
    #
    # Revisit when either is true, whichever comes first: a v3.5 chart has run in
    # a non-production cluster here for a full release cycle, or the date passes
    # 2026-11-06. A deliberate lag nobody re-checks is indistinguishable from
    # staleness, so this pin needs a trigger, not just a reason.
    version: 10.2.2
    values:
      - bootstrap/argocd-values.yaml.gotmpl
