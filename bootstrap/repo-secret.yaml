# Credential Argo CD uses to read the gitops repository: a GitHub App, per
# https://argo-cd.readthedocs.io/en/stable/user-guide/private-repositories/#github-app-credential
#
# `${...}` placeholders are expanded from the environment by `just bootstrap`
# before this is applied. They are plain strings, so this file stays valid YAML
# and can be checked with kubeconform as-is.
#
# The private key is carried base64-encoded under `data:` while everything else
# sits in `stringData:`. The two are one Secret: the API server base64-encodes
# every `stringData` entry, merges it over `data`, and stores only `data` — so
# this is the same object the Argo CD documentation shows as a single
# `stringData` block, written in two halves. The split is what makes the
# substitution safe: a PEM is multi-line and `envsubst` knows nothing about
# YAML, so expanding one into an indented block scalar would leave every line
# after the first at column zero — a manifest that either fails to parse or,
# worse, parses into something else. Base64 is a single line with no
# YAML-significant characters, and the API server decodes it back to the exact
# bytes of the file the operator generated.
#
# Deliberately NOT part of the argo-cd Helm release: once the gitops repository
# takes over managing Argo CD, a Helm-owned Secret outside that Application's
# manifests would be pruned, and Argo CD would lose access to the repository
# that manages it.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-repo
  namespace: argocd
  labels:
    # The label Argo CD scans for when it builds its repository list.
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  # Quoted so a value containing YAML-significant characters still parses, and
  # so the two ids stay strings rather than becoming YAML integers.
  url: "${GITOPS_REPO_URL}"
  githubAppID: "${GITOPS_REPO_GITHUB_APP_ID}"
  githubAppInstallationID: "${GITOPS_REPO_GITHUB_APP_INSTALLATION_ID}"
  # GitHub Enterprise Server needs one more field here —
  # githubAppEnterpriseBaseUrl: https://ghe.example.com/api/v3 — which is the
  # github-enterprise-repo example in
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
  # (the page above shows the CLI form, not these keys). Not parameterised:
  # github.com takes no such field, and an optional `${...}` would expand to an
  # empty string on every other cluster,
  # which is exactly what .claude/rules/envsubst-must-guard-variables.md exists
  # to stop. A GHE cluster adds the line.
data:
  # base64 of the PEM file named by GITOPS_REPO_GITHUB_APP_PRIVATE_KEY_PATH.
  # Encoded by `just _apply-repo-secret`; never typed by hand.
  githubAppPrivateKey: "${GITOPS_REPO_GITHUB_APP_PRIVATE_KEY_B64}"
