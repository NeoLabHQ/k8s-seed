# The handoff. Applying this is the last imperative act against the cluster:
# from here Argo CD reconciles generated/clusters/${TARGET_CLUSTER_NAME}/ in the
# gitops repository, including the Application that manages Argo CD itself.
#
# `${...}` placeholders are expanded from the environment by `just bootstrap`.
#
# The source type is deliberately left unset so Argo CD auto-detects it. The
# gitops repository may render generated/clusters/<name>/ as plain Application
# manifests, a kustomization, or a Helm chart. See docs/gitops-repo.md.
#
# CONTRACT: as a plain-YAML directory, generated/clusters/<name>/ must be flat.
# Argo CD does not recurse unless spec.source.directory.recurse is set, and
# setting it is not an option here: any spec.source.directory block makes the
# source type explicit, which switches auto-detection off and breaks the
# kustomization and Helm layouts above. Nest with a kustomization or a chart,
# not subdirectories.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Cascade. Deleting this Application deletes everything the gitops
    # repository put on the cluster, which is what makes it a root.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Quoted so a revision like `1.0` is not read as a number.
    repoURL: "${GITOPS_REPO_URL}"
    targetRevision: "${GITOPS_TARGET_REVISION}"
    path: "generated/clusters/${TARGET_CLUSTER_NAME}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Day 0 the gitops path legitimately does not exist yet, and the children
    # sync before the CRDs and cert-manager they need. Both resolve on their
    # own; backoff keeps Argo CD from hot-looping on the failures until they do.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
